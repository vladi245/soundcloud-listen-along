name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chromium
        - Firefox
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
